name: Controles bowser

# De bowser-ai-lite: se reemplaza al actualizar el kit (si lo editas, el instalador lo respeta y avisa).
# Lo que el proyecto necesite para sus pruebas (instalar dependencias, levantar servicios) va en el objetivo
# `ci-setup` del Makefile; este workflow lo corre si existe. Si las pruebas necesitan una base de datos, agrégala
# aquí como `services:` del trabajo "pruebas".

on:
  pull_request:
  push:
    branches: [main, master]

# Solo lectura. gitleaks lista los commits del pull request (pull-requests: read); sin este permiso falla con 403
# "Resource not accessible by integration" en los repositorios donde el token por defecto solo lee el contenido.
permissions:
  contents: read
  pull-requests: read

jobs:
  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pruebas:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Las versiones las decide el proyecto en .bowser/versiones (no se edita este archivo para eso).
      # Sin valor: Go la de go.mod, PHP la última y Node la LTS.
      - name: Versiones del proyecto
        id: versiones
        run: |
          leer() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\([^#[:space:]]*\).*/\1/p" .bowser/versiones 2>/dev/null | head -n 1; }
          go=$(leer go); php=$(leer php); node=$(leer node)
          if [ -z "$go" ]; then
            gomod=$(git ls-files 'go.mod' '*/go.mod' | head -n 1)
            [ -n "$gomod" ] && go=$(sed -n 's/^go[[:space:]]\{1,\}\([0-9][0-9.]*\).*/\1/p' "$gomod" | head -n 1)
          fi
          { echo "go=${go:-stable}"; echo "php=${php:-latest}"; echo "node=${node:-lts/*}"; } | tee -a "$GITHUB_OUTPUT"
      - if: hashFiles('**/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versiones.outputs.go }}
      - if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versiones.outputs.node }}
      - if: hashFiles('**/composer.json') != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.versiones.outputs.php }}
      - name: Preparar (make ci-setup, si existe)
        run: if make -n ci-setup >/dev/null 2>&1; then make ci-setup; fi
      - name: make check
        run: make check

  rama:
    name: Pruebas y tamaño de la rama
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 .bowser/verificar.py --ci --base "origin/${{ github.base_ref }}"
